<div class="course-card">

  <h3>{{ course.name }}</h3>

  <p>
    <strong>Course Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <p>
    <strong>Grade Status:</strong>
    {{ course.gradeStatus }}
  </p>

  <button
    type="button"
    (click)="toggleEnrollment()"
  >
    {{ isEnrolled(course.id) ? 'Unenroll' : 'Enroll' }}
  </button>

</div>
